<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#031b23" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Monsters of the Deep" />
    <title>Monsters of the Deep</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/assets/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/assets/icon-192.png" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <canvas id="game" aria-label="Monsters of the Deep game canvas"></canvas>

    <main class="overlay">
      <section class="hud panel" id="hud" aria-live="polite">
        <div>
          <span class="label">Mass</span>
          <strong id="massValue">0</strong>
        </div>
        <div>
          <span class="label">Stage</span>
          <strong id="stageValue">Hatchling</strong>
        </div>
        <div>
          <span class="label">Add-ons</span>
          <strong id="addonValue">None</strong>
        </div>
        <div class="locus-row" id="locusRow" hidden>
          <span id="regionValue"></span><span class="locus-sep"> · </span><span id="zoneValue"></span><span id="depthValue" class="locus-depth"></span>
        </div>
      </section>

      <aside class="leaderboard panel">
        <div class="panel-title">Leaderboard</div>
        <ol id="leaderboardList"></ol>
      </aside>

      <section class="status-stack" id="statusStack" aria-live="polite">
        <div class="event-feed" id="eventFeed"></div>
        <span class="connection-pill" id="connectionStatus">Connecting</span>
      </section>

      <aside class="minimap panel" id="minimap" hidden aria-label="Location map">
        <canvas id="minimapCanvas" width="150" height="150"></canvas>
        <div class="minimap-caption">
          <strong id="minimapRegion">—</strong>
          <span id="minimapZone"></span>
        </div>
      </aside>

      <aside class="depth-gauge" id="depthGauge" hidden aria-label="Depth">
        <div class="depth-track" id="depthTrack"></div>
        <div class="depth-marker" id="depthMarker"><span id="depthMarkerLabel">0 m</span></div>
      </aside>

      <div class="hover-tip" id="hoverTip" hidden></div>

      <section class="death-banner panel" id="deathBanner" hidden>
        <strong id="deathTitle">Consumed</strong>
        <span id="deathDetail">Returning to the bloom</span>
      </section>

      <section class="join-modal panel" id="joinModal">
        <div class="brand-lockup">
          <span class="brand-mark"></span>
          <div>
            <h1>Monsters of the Deep</h1>
            <p>Grow from a fragile hatchling into the largest predator in the water.</p>
          </div>
        </div>

        <label class="field">
          <span>Name</span>
          <div class="quick-names" id="quickNames" role="group" aria-label="Quick names">
            <button type="button" class="quick-name" data-name="Luke">Luke</button>
            <button type="button" class="quick-name" data-name="Axel">Axel</button>
            <button type="button" class="quick-name" data-name="Neo">Neo</button>
          </div>
          <input id="playerName" maxlength="18" autocomplete="nickname" placeholder="Or type your own name" required />
          <span class="field-error" id="nameError" aria-live="polite"></span>
        </label>

        <div class="creature-picker" id="creaturePicker" role="radiogroup" aria-label="Creature"></div>

        <div class="resume-block" id="resumeBlock" hidden>
          <label class="resume-toggle">
            <input type="checkbox" id="resumeCheckbox" checked />
            <span id="resumeText">Resume solo run</span>
          </label>
          <button type="button" class="ghost-button" id="clearSaveButton">Start fresh</button>
        </div>

        <button class="primary-button" id="joinButton" disabled>Enter the Deep</button>
        <button class="secondary-button" id="installButton" hidden>⤓ Install on this device</button>
        <p class="install-hint" id="iosInstallHint" hidden>
          On iPad: tap <strong>Share</strong> then <strong>Add to Home Screen</strong> to install.
        </p>
      </section>
    </main>

    <script type="module" src="/client.js"></script>
  </body>
</html>
